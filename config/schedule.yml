clean_up_tz:
  cron: "0 5 * * * Europe/Amsterdam"
  class: "CleanupWorker"
  queue: default

minutely_tz:
  cron: "* * * * * Europe/Amsterdam"
  class: "CronWorker"
  queue: priority

server_updates_tz:
  cron: "* * * * * Europe/Amsterdam"
  class: "ServerVersionWorker"
  queue: default

monthly_donations_tz:
  cron: "15 2,21 * * * Europe/Amsterdam"
  class: "MonthlyDonationProgressAnnouncerWorker"
  queue: default

private_server_cleanup_tz:
  cron: "0 */6 * * * Europe/Amsterdam"
  class: "PrivateServerCleanupWorker"
  queue: default

notifications_tz:
  cron: "*/20 * * * * Europe/Amsterdam"
  class: "ServersNotificationWorker"
  queue: default

available_maps_tz:
  cron: "*/10 * * * * Europe/Amsterdam"
  class: "AvailableMapsWorker"
  queue: default

daily_zipfile_upload_tz:
  cron: "0 3 * * * Europe/Amsterdam"  # Run daily at 3 AM Amsterdam time
  class: "DailyZipfileUploadWorker"
  queue: default

# The upstream league map sync is deliberately not scheduled here: this fork's
# config/league_maps.yml is its own, and pulling Arie/serveme's would replace
# the Frontress map groups with Team Fortress league ones every hour. The
# worker still exists, so an admin can run it by hand if they want to look.

docker_image_poll_tz:
  cron: "*/5 * * * * Europe/Amsterdam"
  class: "DockerImagePollWorker"
  queue: default

cloud_server_cleanup_tz:
  cron: "*/10 * * * * Europe/Amsterdam"  # Run every 10 minutes
  class: "CloudServerCleanupWorker"
  queue: default

cloud_server_orphan_cleanup_tz:
  cron: "*/30 * * * * Europe/Amsterdam"
  class: "CloudServerOrphanCleanupWorker"
  queue: default
