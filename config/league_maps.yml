---
# Map groups shown in the map picker.
#
# Upstream serveme keeps this list in sync with a file in the Arie/serveme
# repository, which is a list of Team Fortress league maps. This fork owns its
# own list -- these are the maps Team Frontress plays -- so the sync worker is
# off and this file is edited here.
#
# The coordinator has its own copy of the maps each match group may pick from
# (match_groups[].maps in coordinator.json). Keeping the two in step is a
# deliberate manual act: a map the site cannot hand out is not a map a match
# should be formed on.
league_maps:
- name: Frontress Casual
  active: true
  maps:
  - koth_product_final
  - cp_process_final
  - pl_upward
  - ctf_turbine
- name: Frontress Ranked 6v6
  active: true
  maps:
  - cp_process_final
  - cp_gullywash_final1
  - koth_product_final
  - cp_snakewater_final1
  - cp_granary_pro_rc8
