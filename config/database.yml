# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
development:
  adapter: postgresql
  database: serveme_development
  username: serveme
  encoding: unicode
  pool: 5
  timeout: 5000

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test: &test
  adapter: postgresql
  database: <%= "#{ENV['TEST_DATABASE'] || 'serveme_test'}#{ENV['TEST_ENV_NUMBER']}" %>
  username: serveme
  encoding: unicode
  pool: 5
  timeout: 5000

# DATABASE_URL, when set, overrides all of this -- that is Rails' own rule and
# it is what the Kamal deploys use. The parts below are for docker compose,
# where assembling a URL out of a password variable inside YAML is worse than
# passing the pieces.
production:
  adapter: postgresql
  database: <%= ENV.fetch("POSTGRES_DB", "serveme_production") %>
  username: <%= ENV.fetch("POSTGRES_USER", "serveme") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 12 } %>
  timeout: 5000

cucumber:
  <<: *test
