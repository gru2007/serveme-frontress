name: Game server image

# Builds docker/frontress-server and pushes it to GHCR, which is where
# FRONTRESS_SERVER_IMAGE points by default.
#
# The image is the game payload from the game repository's release on top of
# steamcmd, the Steam Linux Runtime and TF2's content files. Those last three
# are about 15GB of downloads, which is more than a stock runner has free --
# hence the cleanup step.

on:
  push:
    branches: [master]
    paths:
      - "docker/frontress-server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Dedicated payload tarball (defaults to the game repo's latest release)"
        required: false
      version:
        description: "Build version, for the image tag (steam.inf PatchVersion)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # A stock runner has ~14GB free; the base stage needs more than that.
      - name: Make room for the game files
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/frontress-server
          SERVER_URL: ${{ inputs.server_url }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args=(--build-arg "CACHEBUST=${GITHUB_SHA}")
          [ -n "${SERVER_URL}" ] && args+=(--build-arg "FRONTRESS_SERVER_URL=${SERVER_URL}")
          [ -n "${VERSION}" ] && args+=(--build-arg "FRONTRESS_VERSION=${VERSION}")

          tags=(-t "${IMAGE}:latest")
          [ -n "${VERSION}" ] && tags+=(-t "${IMAGE}:${VERSION}")

          docker build "${args[@]}" "${tags[@]}" docker/frontress-server
          docker push "${IMAGE}:latest"
          [ -n "${VERSION}" ] && docker push "${IMAGE}:${VERSION}"

          echo "Pushed ${IMAGE}:latest"
          echo "Point FRONTRESS_SERVER_IMAGE at it, or leave the default."
