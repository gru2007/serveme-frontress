# serveme, self-contained.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# Publishes two ports: SERVEME_HTTP_PORT for a reverse proxy to sit in front
# of, and SERVEME_LOG_PORT/udp for game servers to send their console logs to.
# Everything else stays on the internal network.
#
# Optional roles are behind profiles:
#   docker compose --profile discord up -d      # also run the Discord bot

name: serveme

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: serveme:local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  env_file:
    - .env
  environment: &app-env
    RAILS_ENV: ${RAILS_ENV:-production}
    RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-1}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-12}
    # Inside the compose network the services are reachable by name on their
    # real ports. Publishing a different port on the host changes nothing here,
    # which is what the previous version of this file got wrong.
    #
    # The database is passed as parts rather than a URL: config/database.yml
    # reads them, and building a URL around a password inside YAML is a good
    # way to get quoting wrong once and debug it for an hour. Setting
    # DATABASE_URL still overrides everything, as Rails always allows.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-serveme_production}
    POSTGRES_USER: ${POSTGRES_USER:-serveme}
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - generate one with openssl rand -hex 24}"
    REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env - generate one with openssl rand -hex 64}"
    STEAM_API_KEY: "${STEAM_API_KEY:?set STEAM_API_KEY in .env - get one at https //steamcommunity.com/dev/apikey}"
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    SITE_URL: "${SITE_URL:?set SITE_URL in .env - the address users type to reach this site}"
    # Empty is fine: the app derives the host from SITE_URL.
    SITE_HOST: ${SITE_HOST:-}
    MAPS_DIR: ${MAPS_DIR:-/rails/tmp/maps}
    SENTRY_DSN: ${SENTRY_DSN:-}
    # Game servers. They are containers, started on this machine's docker
    # daemon (FRONTRESS_LOCAL_DOCKER) or on a remote docker host over SSH.
    FRONTRESS_SERVER_IMAGE: ${FRONTRESS_SERVER_IMAGE:-ghcr.io/gru2007/frontress-server:latest}
    FRONTRESS_LOCAL_DOCKER: ${FRONTRESS_LOCAL_DOCKER:-}
    FRONTRESS_LOCAL_DOCKER_MAX_CONTAINERS: ${FRONTRESS_LOCAL_DOCKER_MAX_CONTAINERS:-4}
    FRONTRESS_SERVER_VERSION: ${FRONTRESS_SERVER_VERSION:-}
    FRONTRESS_FASTDL_URL: ${FRONTRESS_FASTDL_URL:-}
    FRONTRESS_DEFAULT_MAP: ${FRONTRESS_DEFAULT_MAP:-koth_product_final}
    FRONTRESS_GSLT: ${FRONTRESS_GSLT:-}
    # This site's identity: what it calls itself, where servers reach it, and
    # which links belong to this community rather than to serveme.tf.
    FRONTRESS_DIRECT_HOST: ${FRONTRESS_DIRECT_HOST:-}
    FRONTRESS_LOG_ADDRESS: ${FRONTRESS_LOG_ADDRESS:-}
    SERVEME_LOG_PORT: ${SERVEME_LOG_PORT:-40001}
    FRONTRESS_DISCORD_URL: ${FRONTRESS_DISCORD_URL:-}
    FRONTRESS_DISCORD_COMMAND: ${FRONTRESS_DISCORD_COMMAND:-frontress}
    FRONTRESS_SOURCE_URL: ${FRONTRESS_SOURCE_URL:-https://github.com/gru2007/serveme-frontress}
    FRONTRESS_REGION: ${FRONTRESS_REGION:-EU}
    FRONTRESS_TIME_ZONE: ${FRONTRESS_TIME_ZONE:-Europe/Amsterdam}
    FRONTRESS_LEAGUE: ${FRONTRESS_LEAGUE:-}
    FRONTRESS_PEER_SITES: ${FRONTRESS_PEER_SITES:-}
    FRONTRESS_CLEANUP_AGE_DAYS: ${FRONTRESS_CLEANUP_AGE_DAYS:-30}
    FRONTRESS_MONTHLY_GOAL: ${FRONTRESS_MONTHLY_GOAL:-50}
    FRONTRESS_MAPS: ${FRONTRESS_MAPS:-}
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-}
    ZIPFILE_STORAGE_SERVICE: ${ZIPFILE_STORAGE_SERVICE:-}
    # A container is on the host's network, so it cannot reach this app on a
    # compose-internal name. These are how it gets back to us.
    DOCKER_HOST_IP: ${DOCKER_HOST_IP:-}
    CLOUD_CALLBACK_HOST: ${CLOUD_CALLBACK_HOST:-}
    # The matchmaking coordinator.
    FRONTRESS_COORDINATOR_URL: ${FRONTRESS_COORDINATOR_URL:-}
    FRONTRESS_COORDINATOR_SECRET: ${FRONTRESS_COORDINATOR_SECRET:-}
  volumes: &app-volumes
    # Uploads and logs outlive containers; maps are a cache but re-downloading
    # a few gigabytes on every restart is not a cache.
    - uploads:/rails/public/uploads
    - system:/rails/public/system
    # Active Storage on the local disk: map uploads and reservation zip files
    # live here when no object storage is configured, which is the default.
    - storage:/rails/storage
    - server_logs:/rails/server_logs
    - rails_logs:/rails/log
    - maps:/rails/tmp/maps
    # doc/ holds runtime data the app reads -- the ban and VPN lists -- plus
    # the GeoIP databases, which are gitignored. Bound read-write so
    # `rails maxmind:fetch` can write them. Without the GeoIP files, IP
    # geolocation is the only thing that stops working.
    - ./doc:/rails/doc
    # The docker socket, so this app can start game server containers on the
    # machine it runs on. That is the default deployment: one box, one
    # `docker compose up`, and game servers as containers beside the site.
    #
    # It is real access to the host's docker daemon, which is real privilege.
    # Comment it out if game servers only ever run on separate hosts, and set
    # FRONTRESS_LOCAL_DOCKER= (empty) to match.
    - /var/run/docker.sock:/var/run/docker.sock
  # The docker socket is owned by the host's docker group, and this container
  # runs as an unprivileged user. DOCKER_GID is that group's id on the host
  # (`getent group docker | cut -d: -f3`); the default is what Debian and
  # Ubuntu usually pick.
  group_add:
    - "${DOCKER_GID:-999}"
  networks:
    - serveme

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serveme}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - generate one with openssl rand -hex 24}"
      POSTGRES_DB: ${POSTGRES_DB:-serveme_production}
      # Postgres only applies these when it initialises the data directory.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Named user and database, because the defaults are not ours.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - serveme

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    # Sidekiq queues live here. Losing them on a host reboot means losing
    # scheduled reservation ends, so it is worth a disk write.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - serveme

  # Runs once per `up`, before anything that touches the database. Kamal does
  # this in a pre-deploy hook; compose has no hooks, so it is a service that
  # everything else waits to complete.
  migrate:
    <<: *app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./bin/rails", "db:prepare"]

  web:
    <<: *app
    # Thruster listens on 80 and proxies to Rails. Put your own TLS in front.
    ports:
      - "${SERVEME_BIND:-127.0.0.1}:${SERVEME_HTTP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  sidekiq:
    <<: *app
    command: ["bundle", "exec", "sidekiq", "-c", "${SIDEKIQ_CONCURRENCY:-10}"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Receives srcds console logs over UDP. Every server in the pool sends here,
  # so this port must be reachable from outside regardless of SERVEME_BIND.
  logdaemon:
    <<: *app
    command: ["bundle", "exec", "ruby", "script/logdaemon"]
    ports:
      - "${SERVEME_LOG_PORT:-40001}:40001/udp"

  discord_bot:
    <<: *app
    profiles: ["discord"]
    command: ["bundle", "exec", "ruby", "discord_bot/bot.rb"]
    environment:
      <<: *app-env
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

volumes:
  postgres_data:
  redis_data:
  uploads:
  system:
  storage:
  server_logs:
  rails_logs:
  maps:

networks:
  serveme:
